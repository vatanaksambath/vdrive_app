name: Build VDrive APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build VDrive Geely M7 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/debug/app-debug.apk build_output/VDrive-Geely-M7.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VDrive-Geely-M7-APK
          path: build_output/VDrive-Geely-M7.apk
          retention-days: 14
